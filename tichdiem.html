<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tích điểm Nhà Kòi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #f39c12;
      --secondary-color: #e67e22;
      --background-color: #f89406;
      --text-dark: #2d3436;
      --text-light: #555;
      --white: #fff;
      --grey-light: #f9f9f9;
      --grey-border: #eee;
      --success-color: #27ae60;
      --error-color: #e74c3c;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--background-color);
      background-image: 
        linear-gradient(45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.08) 75%, rgba(255, 255, 255, 0.08)),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.08) 75%, rgba(255, 255, 255, 0.08));
      background-size: 40px 40px;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--white);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .logo { max-width: 120px; margin-bottom: 8px; border-radius: 12px; }
    .main-title { margin: 5px 0 2px; text-transform: uppercase; font-size: 20px; font-weight: 600; color: var(--text-dark); }
    .subtitle { font-size: 14px; color: var(--text-light); margin-bottom: 25px; }

    #phone {
      width: 100%; padding: 10px 5px; margin-bottom: 25px; border: none;
      border-bottom: 2px solid #ddd; border-radius: 0; font-size: 16px;
      font-family: 'Poppins', sans-serif; background-color: transparent;
      text-align: center; transition: border-color 0.3s;
    }
    #phone:focus { outline: none; border-color: var(--primary-color); }

    #submitBtn {
      width: 100%; padding: 12px 15px; background-color: var(--primary-color);
      color: var(--white); border: none; border-radius: 8px; font-size: 18px;
      font-weight: 600; cursor: pointer; transition: background-color 0.2s;
      display: flex; justify-content: center; align-items: center;
    }
    #submitBtn:hover { background-color: var(--secondary-color); }

    #result { margin-top: 15px; font-weight: 600; min-height: 20px; line-height: 1.5; }
    
    .rewards-box {
      margin-top: 25px; padding: 12px 14px; border-radius: 10px; font-size: 14px;
      color: #444; text-align: left; border: 1px dashed var(--primary-color);
    }
    .rewards-box h4 { font-weight: 600; color: var(--text-dark); text-align: center; margin-bottom: 8px; }
    .rewards-box p { margin: 4px 0; line-height: 1.5; }

    .loading-spinner {
      border: 3px solid #f3f3f3; border-top: 3px solid var(--text-dark);
      border-radius: 50%; width: 20px; height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div class="container">
    <img src="https://i.postimg.cc/nrVBd9LD/logo.png" class="logo" alt="Logo Ông Kòi" />

    <h2 class="main-title">TÍCH ĐIỂM NHÀ KÒI</h2>
    <p class="subtitle">Bánh Mì Ông "<strong>KÒI</strong>" – Ăn Vào Nhớ "<strong>HÒI</strong>" Đà Nẵng</p>

    <div id="form-container">
        <input type="tel" id="phone" placeholder="Nhập số điện thoại Zalo" />
        <button id="submitBtn" onclick="submitData()">
          <span id="btnText">Tích điểm</span>
          <span id="loadingSpinner" class="loading-spinner" style="display: none;"></span>
        </button>
    </div>
    
    <p id="result"></p>

    <div class="rewards-box">
      <h4>⭐ Chương trình đổi thưởng ⭐</h4>
      <p>🎁 <strong>100 điểm:</strong> 1 Ly nước miễn phí</p>
      <p>🎁 <strong>200 điểm:</strong> 1 Bánh mì miễn phí</p>
      <p>🎁 <strong>300 điểm:</strong> 1 Combo (Bánh mì + Nước)</p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzgrAJB266q718FuMZG6Cnu5pMFsh6XbnlGD8VTt1pQ4pIfftGcCdyBkoKlxyAvRPxUzw/exec";
    let qrCode = null;

    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        qrCode = urlParams.get('tich');
        if (!qrCode) {
            document.getElementById('form-container').style.display = 'none';
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Lỗi: Mã QR không hợp lệ hoặc đã hết hạn.';
            resultEl.style.color = 'var(--error-color)';
        }
    });

    function submitData() {
        const phoneInput = document.getElementById('phone');
        const resultEl = document.getElementById('result');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const phone = phoneInput.value.trim();

        if (!qrCode) {
            resultEl.textContent = 'Lỗi: Không tìm thấy mã QR.';
            resultEl.style.color = 'var(--error-color)';
            return;
        }

        if (phone === '' || !/^\d{10}$/.test(phone)) {
            resultEl.textContent = 'Vui lòng nhập SĐT hợp lệ (10 số).';
            resultEl.style.color = 'var(--error-color)';
            return;
        }
        
        btnText.style.display = 'none';
        loadingSpinner.style.display = 'block';
        submitBtn.disabled = true;
        resultEl.textContent = '';

        // SỬA LỖI: Chuyển sang phương thức GET để đảm bảo kết nối thành công
        const requestUrl = `${API_URL}?code=${encodeURIComponent(qrCode)}&phone=${encodeURIComponent(phone)}`;
        
        fetch(requestUrl)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    resultEl.textContent = 'Tích điểm thành công!';
                    resultEl.style.color = 'var(--success-color)';
                    document.getElementById('form-container').style.display = 'none';
                } else {
                    resultEl.textContent = data.message || 'Có lỗi xảy ra.';
                    resultEl.style.color = 'var(--error-color)';
                    btnText.style.display = 'inline';
                    loadingSpinner.style.display = 'none';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error('Lỗi:', error);
                resultEl.textContent = 'Lỗi kết nối. Vui lòng thử lại.';
                resultEl.style.color = 'var(--error-color)';
                btnText.style.display = 'inline';
                loadingSpinner.style.display = 'none';
                submitBtn.disabled = false;
            });
    }
  </script>
</body>
</html>
