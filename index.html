<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ưu Đãi Đặc Biệt - Bánh Mì Ông Kòi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap');
        :root {
            --primary-color: #fc6806;
            --dark-color: #A15200;
            --background-color: #FFF7ED;
            --text-color: #4B5563;
            --white-color: #FFFFFF;
            --error-color: #DC2626;
            --hot-deal-color: #ff4d4d;
            --admin-bg: #2c3e50;
            --radius: 20px;
            --shadow: 0 10px 30px -5px rgba(252, 104, 6, 0.15);
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .main-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .card {
            background-color: var(--white-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px 35px 35px 35px;
            position: relative;
            margin-top: 60px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: -75px auto 15px;
            display: block;
            position: relative;
            z-index: 2;
            border: 5px solid var(--white-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            animation: slideUp 0.7s 0.2s cubic-bezier(0.25, 1, 0.5, 1) both;
            cursor: pointer;
        }
        
        .promo-image-wrapper {
            position: relative;
            margin-bottom: 25px;
            overflow: hidden; 
            border-radius: var(--radius);
            animation: imageImpactDrop 1s cubic-bezier(0.25, 1, 0.5, 1) 0.4s both;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        
        @keyframes imageImpactDrop {
            0% { transform: translateY(-100%) scale(0.8); opacity: 0; }
            60% { transform: translateY(10px) scale(1.05); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.95); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .promo-image-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 70%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: shine-effect 1.5s ease-in-out 1.2s; 
        }

        @keyframes shine-effect {
            to { left: 150%; }
        }

        .promo-image {
            width: 100%;
            display: block;
        }

        .promo-badge {
            position: absolute;
            top: 20px;
            right: -8px;
            background: linear-gradient(45deg, var(--hot-deal-color), #ff8c00);
            color: white;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-transform: uppercase;
            transform-origin: bottom left; 
            animation: badgeSlapOn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s both, 
                       badgeWiggle 2.5s infinite 2s;
        }

        @keyframes badgeSlapOn {
            0% { transform: scale(0) rotate(-90deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(25deg); opacity: 1; }
            100% { transform: scale(1) rotate(15deg); opacity: 1; }
        }
        
        @keyframes badgeWiggle {
            0%, 100% { transform: rotate(15deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(20deg); }
        }

        .offer-title {
            margin-bottom: 25px;
        }
        
        .main-title {
            color: var(--dark-color);
            font-weight: 700;
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            animation: slideUp 0.7s 1.2s cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        .price-block {
            background-color: #fff;
            border: 2px dashed var(--primary-color);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 25px;
            animation: slideUp 0.7s 1.3s cubic-bezier(0.25, 1, 0.5, 1) both;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        .price-line {
            overflow: hidden;
        }
        .price-line span {
            display: inline-block;
            transform: translateY(110%);
            animation: textReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .original-price {
            font-size: 1.2rem;
            color: var(--text-color);
            font-weight: 600;
        }
        .original-price span { animation-delay: 1.4s; }

        .deal-label {
            font-size: 1rem;
            color: var(--dark-color);
            font-weight: 700;
            text-transform: uppercase;
            margin: 8px 0;
        }
        .deal-label span {
            animation: 
                textReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards,
                bounce 2s ease-in-out 2.4s infinite;
        }

        .final-price {
            font-size: 3rem;
            color: var(--hot-deal-color);
            font-weight: 700;
            line-height: 1.2;
        }
        .final-price span {
            display: inline-block;
            transform: translateY(110%);
            animation: 
                textReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.6s forwards,
                priceWiggle 1.5s linear 2.5s infinite;
        }

        @keyframes textReveal {
            to { transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-15px);
            }
            60% {
                transform: translateY(-7px);
            }
        }
        
        @keyframes priceWiggle {
            0%, 100% { transform: rotate(0); }
            20% { transform: rotate(-3deg); }
            40% { transform: rotate(3deg); }
            60% { transform: rotate(-3deg); }
            80% { transform: rotate(3deg); }
        }
        
        .input-group {
             animation: slideUp 0.7s 1.8s cubic-bezier(0.25, 1, 0.5, 1) both;
             transition: transform 0.4s ease;
        }
        input[type="tel"], input[type="text"], input[type="password"] {
            width: 100%; padding: 18px; border: 2px solid #E5E7EB;
            border-radius: var(--radius); font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif; font-weight: 700;
            box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        input[type="tel"]:focus, input[type="text"]:focus, input[type="password"]:focus {
            outline: none; border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(252, 104, 6, 0.1);
        }
        input[type="tel"].error, input[type="text"].error, input[type="password"].error {
            border-color: var(--error-color);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        button.submit-btn {
            width: 100%; padding: 18px; background: var(--primary-color);
            color: var(--white-color); border: none; border-radius: var(--radius);
            font-size: 1.3rem; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s; 
            display: flex;
            justify-content: center; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 25px;
            box-shadow: 0 4px 20px -5px rgba(252, 104, 6, 0.5);
            animation: 
                slideUp 0.7s 2.0s cubic-bezier(0.25, 1, 0.5, 1) both,
                buttonBreathe 3s ease-in-out 2.5s infinite;
        }
        
        @keyframes buttonBreathe {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 20px -5px rgba(252, 104, 6, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 6px 25px -5px rgba(252, 104, 6, 0.7); }
        }

        button.submit-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 25px -5px rgba(252, 104, 6, 0.6);
        }
        button.submit-btn:active {
            transform: translateY(-1px) scale(0.98);
        }
        button.submit-btn:disabled {
            opacity: 0.7; cursor: not-allowed;
            transform: translateY(0);
            animation: none;
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #ffffff;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* FOCUS EFFECT CLASS */
        .form-focused .promo-image-wrapper,
        .form-focused .price-block {
            transform: scale(0.95);
            opacity: 0.6;
        }
        .form-focused .input-group {
            transform: scale(1.05);
        }

        .message-area {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            line-height: 1.5;
            background-color: #FFFBEB;
            color: #92400E;
            border: 1px solid #FEEBCB;
            animation: slideIn 0.4s ease-out;
        }
        .message-area svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            stroke: #D97706;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .result-screen {
            text-align: center;
        }
        .result-screen .logo { max-width: 80px; margin-bottom: 15px; }
        .result-screen h2 {
            font-size: 1.5rem; color: var(--dark-color);
            margin: 0 0 10px; text-transform: uppercase;
        }
        .result-screen .promo-details {
            background-color: #FFFBEB; padding: 15px;
            border-radius: 10px; margin-bottom: 20px;
            border: 2px dashed var(--primary-color);
        }
        .result-screen .promo-details p {
            margin: 0; font-size: 1.1rem;
            color: var(--dark-color); font-weight: 600;
        }
        .result-screen .promo-details .price {
            font-size: 2.5rem; font-weight: 700;
            color: var(--primary-color); margin-top: 5px;
        }
        .result-screen .instructions {
            font-size: 1rem; color: var(--text-color);
            background-color: #F3F4F6; padding: 15px;
            border-radius: 10px; font-weight: 600;
            line-height: 1.6;
        }
        .fb-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #1877F2;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px -5px rgba(24, 119, 242, 0.5);
            animation: tada 2.5s ease-in-out infinite;
        }
        
        @keyframes tada {
            from {
                transform: scale3d(1, 1, 1);
            }
            10%, 20% {
                transform: scale3d(0.95, 0.95, 0.95) rotate3d(0, 0, 1, -5deg);
            }
            30%, 50%, 70%, 90% {
                transform: scale3d(1.05, 1.05, 1.05) rotate3d(0, 0, 1, 5deg);
            }
            40%, 60%, 80% {
                transform: scale3d(1.05, 1.05, 1.05) rotate3d(0, 0, 1, -5deg);
            }
            to {
                transform: scale3d(1, 1, 1);
            }
        }

        .fb-button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 6px 20px -5px rgba(24, 119, 242, 0.6);
            animation-play-state: paused;
        }
        .fb-button svg {
            width: 24px;
            height: 24px;
        }
        
        .follow-us-prompt {
            font-weight: 600;
            color: var(--text-color);
            margin-top: 25px;
            font-size: 0.95rem;
        }

        .confetti {
            position: fixed; top: 0; left: 0; width: 100%;
            height: 100%; pointer-events: none; z-index: 1;
        }
        .confetti-piece {
            position: absolute; width: 10px; height: 20px;
            background: var(--primary-color); top: -50px;
            opacity: 0; animation: drop 4s linear infinite;
        }
        .confetti-piece:nth-child(2n) { background: #FFD700; }
        .confetti-piece:nth-child(3n) { background: #FF4D4D; }
        .confetti-piece:nth-child(4n) { background: #34D399; }
        @keyframes drop {
            0% { transform: translateY(0) rotateZ(0); opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg); opacity: 0; }
        }

        /* ADMIN PANEL STYLES */
        #admin-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--admin-bg);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2001;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
        }
        #admin-panel.show {
            transform: translateY(0);
        }
        #admin-panel h3 {
            margin-top: 0;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .admin-group {
            margin-bottom: 15px;
            padding: 15px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .admin-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        #toggle-promo-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
        }
        #toggle-promo-btn.on {
            background-color: var(--hot-deal-color);
            color: white;
        }
        #toggle-promo-btn.off {
            background-color: #27ae60;
            color: white;
        }
        #close-admin-btn {
            width: 100%;
            margin-top: 10px;
            background-color: #95a5a6;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        /* TOAST NOTIFICATION STYLE */
        #social-proof-toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .toast {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: 600;
            font-size: 0.9rem;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast strong {
            color: #f1c40f; /* Yellow color for phone number */
        }
        
        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2002;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 90%;
            width: 320px;
        }
        .modal-overlay.show .modal-content {
            transform: scale(1);
        }
        .modal-content p {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            color: var(--text-color);
            font-weight: 600;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .modal-buttons button, .modal-content button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            margin: 0;
        }
        #custom-confirm-yes, #secret-code-submit, #admin-login-submit {
            background-color: var(--primary-color);
            color: white;
        }
        #custom-confirm-no, #secret-code-cancel, #admin-login-cancel {
            background-color: #bdc3c7;
            color: white;
        }
        .modal-buttons button:hover, .modal-content button:hover {
            transform: scale(1.05);
        }
        #secret-code-modal .input-group, #admin-login-modal .input-group {
            margin-bottom: 15px;
        }
        
        /* SECRET CODE TRIGGER */
        .secret-code-trigger {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--dark-color);
            cursor: pointer;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.2s;
        }
        .secret-code-trigger:hover {
            transform: scale(1.1);
            text-decoration: underline;
        }


        @media (max-width: 480px) {
            body {
                padding-top: 10px;
            }
            .card { 
                padding: 15px;
                margin-top: 45px; 
            }
            
            .logo { 
                width: 70px; 
                height: 70px; 
                margin: -50px auto 10px;
                border-width: 4px;
            }

            .promo-image-wrapper {
                margin-bottom: 15px;
                max-height: 200px;
            }
            .promo-image {
                object-fit: cover;
                height: 100%;
            }
            .promo-badge {
                font-size: 0.8rem;
                padding: 6px 12px;
                top: 10px;
            }

            .offer-title {
                margin-bottom: 15px;
            }

            .main-title { 
                font-size: 1.1rem;
                margin-bottom: 10px;
            }
            .price-block {
                padding: 10px;
                margin-bottom: 15px;
            }
            .original-price { font-size: 1rem; }
            .deal-label { font-size: 0.8rem; margin: 5px 0; }
            .final-price { font-size: 2.5rem; }

            input[type="tel"] {
                padding: 15px;
                font-size: 1rem;
            }
            
            button.submit-btn { 
                font-size: 1.1rem; 
                padding: 15px;
                margin-top: 15px;
            }
            #social-proof-toast-container {
                top: 10px;
                right: 10px;
                left: 10px;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="confetti" id="confetti-container"></div>
    <div id="social-proof-toast-container"></div>

    <div class="main-container" id="main-container">
        <div class="card">
            <div id="form-container">
                <!-- Nội dung sẽ được render bởi JS -->
            </div>
        </div>
    </div>

    <!-- ADMIN PANEL HTML -->
    <div id="admin-panel">
        <h3>BẢNG ĐIỀU KHIỂN</h3>
        <div class="admin-group">
            <label id="promo-status-label">Trạng thái: Đang chạy</label>
            <button id="toggle-promo-btn">TẠM DỪNG ƯU ĐÃI</button>
        </div>
        <button id="close-admin-btn">Đóng</button>
    </div>
    
    <!-- CUSTOM MODALS -->
    <div id="custom-confirm-overlay" class="modal-overlay">
        <div class="modal-content">
            <p id="custom-confirm-msg">Bạn có chắc không?</p>
            <div class="modal-buttons">
                <button id="custom-confirm-yes">Có</button>
                <button id="custom-confirm-no">Không</button>
            </div>
        </div>
    </div>

    <div id="secret-code-overlay" class="modal-overlay">
        <div id="secret-code-modal" class="modal-content">
            <p>Nhập mã ưu đãi của bạn</p>
            <div class="input-group">
                <input type="text" id="secret-code-input" placeholder="MÃ BÍ MẬT">
            </div>
            <div class="input-group">
                <input type="tel" id="secret-code-phone" placeholder="SĐT Zalo của bạn" maxlength="10">
            </div>
            <div id="secret-code-message-area" class="message-area" style="margin-bottom: 20px;"></div>
            <div class="modal-buttons">
                <button id="secret-code-submit" class="submit-btn">
                    <span id="btnTextSecret">Xác nhận</span>
                    <span id="loadingSpinnerSecret" style="display: none;" class="loading-spinner"></span>
                </button>
                <button id="secret-code-cancel">Hủy</button>
            </div>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP ADMIN MỚI -->
    <div id="admin-login-overlay" class="modal-overlay">
        <div id="admin-login-modal" class="modal-content">
            <p>Xác thực Quản trị viên</p>
            <div class="input-group">
                <input type="password" id="admin-password-input" placeholder="Nhập mật khẩu">
            </div>
            <div id="admin-login-message-area" class="message-area" style="margin-bottom: 20px;"></div>
            <div class="modal-buttons">
                <button id="admin-login-submit" class="submit-btn">
                    <span id="btnTextAdminLogin">Đăng nhập</span>
                    <span id="loadingSpinnerAdminLogin" style="display: none;" class="loading-spinner"></span>
                </button>
                <button id="admin-login-cancel">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const DOMElements = {
                formContainer: document.getElementById('form-container'),
                confettiContainer: document.getElementById('confetti-container'),
                toastContainer: document.getElementById('social-proof-toast-container'),
                card: document.querySelector('.card'),
                adminPanel: document.getElementById('admin-panel'),
                togglePromoBtn: document.getElementById('toggle-promo-btn'),
                promoStatusLabel: document.getElementById('promo-status-label'),
                closeAdminBtn: document.getElementById('close-admin-btn'),
            };
            
            // ⭐ ĐÃ CẬP NHẬT URL APPS SCRIPT MỚI CỦA BẠN
            const API_URL = "https://script.google.com/macros/s/AKfycbzDhyBO6hSK4mFIhvlao0DoBHXVWXie9-SPzs49Mm8jvBHX7_qx5lRnNsqJOiophx8sQQ/exec";
            
            // ⭐ BẢO MẬT: Đã xóa mảng SECRET_CODES khỏi client. Việc kiểm tra sẽ do server thực hiện.

            let state = {
                isPromoPaused: false,
                adminPassword: null 
            };
            let socialProofInterval;

            function renderInitialView() {
                DOMElements.formContainer.innerHTML = `
                    <img src="https://i.postimg.cc/1tv3ZfH0/LOGO-1.png" alt="Logo Bánh Mì Ông Kòi" class="logo" id="logo"/>
                    <div class="promo-image-wrapper">
                        <img src="https://i.postimg.cc/qvKqCBJ0/Thi-t-k-ch-a-c-t-n.png" alt="Combo Bánh Bao Xiên Nướng" class="promo-image"/>
                        <div class="promo-badge"><span>🔥</span> Hot Deal</div>
                    </div>
                    <div class="offer-title">
                        <h1 class="main-title">COMBO: BÁNH BAO XIÊN NƯỚNG</h1>
                        <div class="price-block">
                            <div class="price-line original-price"><span>Giá gốc: <del>22.000Đ</del></span></div>
                            <div class="price-line deal-label"><span>🔥 Ưu đãi món mới 🔥</span></div>
                            <div class="price-line final-price"><span>MUA 1 TẶNG 1</span></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <input type="tel" id="phone" placeholder="Nhập số điện thoại Zalo của bạn" maxlength="10">
                    </div>
                    <button id="submitBtn" class="submit-btn">
                        <span id="btnText">NHẬN ƯU ĐÃI NGAY!</span>
                        <span id="loadingSpinner" style="display: none;" class="loading-spinner"></span>
                    </button>
                    <div id="message-area" class="message-area"></div>
                    <div class="secret-code-trigger" id="secret-code-trigger">🎁 Bạn có mã ưu đãi riêng?</div>
                `;
                addFormEventListeners();
                startSocialProof();
            }
            
            function addFormEventListeners() {
                const phoneInput = document.getElementById('phone');
                document.getElementById('logo').addEventListener('click', handleLogoClick);
                document.getElementById('submitBtn').addEventListener('click', handleNormalSubmit);
                phoneInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleNormalSubmit();
                });
                phoneInput.addEventListener('input', (e) => {
                    e.target.classList.remove('error');
                    document.getElementById('message-area').style.display = 'none';
                });
                
                phoneInput.addEventListener('focus', () => DOMElements.formContainer.classList.add('form-focused'));
                phoneInput.addEventListener('blur', () => DOMElements.formContainer.classList.remove('form-focused'));
                document.getElementById('secret-code-trigger').addEventListener('click', showSecretCodeModal);
            }

            function isPeakTime() {
                const now = new Date();
                const hours = now.getHours();
                const isMorningPeak = hours >= 6 && hours < 9;
                const isLunchPeak = hours >= 11 && hours < 14;
                const isEveningPeak = hours >= 17 && hours < 20;
                return isMorningPeak || isLunchPeak || isEveningPeak;
            }
            
            function generateFakePhone() {
                const prefixes = ['090', '091', '093', '098', '086', '033', '035', '037', '038', '039'];
                const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                const lastDigits = Math.floor(Math.random() * 100).toString().padStart(2, '0');
                return `${prefix}*****${lastDigits}`;
            }

            function showSocialProofToast() {
                if (state.isPromoPaused) {
                    if(socialProofInterval) clearInterval(socialProofInterval);
                    return;
                }

                const toast = document.createElement('div');
                toast.className = 'toast';
                const fakePhone = generateFakePhone();
                toast.innerHTML = `⚡️ <strong>${fakePhone}</strong> vừa nhận ưu đãi!`;
                
                DOMElements.toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('show');
                }, 100);

                setTimeout(() => {
                    toast.classList.remove('show');
                    toast.addEventListener('transitionend', () => {
                        if (toast.parentElement) {
                            toast.parentElement.removeChild(toast);
                        }
                    });
                }, 4000); 
            }

            function startSocialProof() {
                fetchInitialState().then(() => {
                    if (state.isPromoPaused) return;
                    const runCheck = () => {
                        if (isPeakTime() && Math.random() < 0.4) {
                            const burstCount = Math.floor(Math.random() * 2) + 2;
                            for (let i = 0; i < burstCount; i++) {
                                setTimeout(() => {
                                    showSocialProofToast();
                                }, i * 800);
                            }
                        } else {
                            showSocialProofToast();
                        }
                    };
                    setTimeout(runCheck, 3500);
                    socialProofInterval = setInterval(runCheck, Math.random() * 8000 + 9000);
                });
            }
            
            async function submitData(phone, secretCode = null) {
                const isSecretSubmission = !!secretCode;
                const btnId = isSecretSubmission ? 'secret-code-submit' : 'submitBtn';
                const messageAreaId = isSecretSubmission ? 'secret-code-message-area' : 'message-area';
                const phoneInput = document.getElementById(isSecretSubmission ? 'secret-code-phone' : 'phone');
                const messageArea = document.getElementById(messageAreaId);
                
                phoneInput.classList.remove('error');
                if(messageArea) messageArea.style.display = 'none';

                if (!/^0[0-9]{9}$/.test(phone)) {
                    showMessage("Số điện thoại không hợp lệ.", messageAreaId);
                    phoneInput.classList.add('error');
                    return false;
                }
                
                toggleButtonLoading(true, btnId);

                try {
                    const payload = { 
                        action: 'savePromoPhone', 
                        phone: phone,
                        ...(secretCode && { code: secretCode })
                    };

                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await res.json();
                    if (result.status !== 'SUCCESS') {
                        throw new Error(result.message || 'Lỗi không xác định từ máy chủ.');
                    }
                    
                    return true;

                } catch (err) {
                    let errorMessage;
                    if (err.message.includes("PHONE_DUPLICATE")) {
                        errorMessage = "Số điện thoại này đã nhận ưu đãi rồi!";
                    } else if (err.message.includes("ALREADY_PENDING")) {
                        errorMessage = "Bạn đã ở trong danh sách chờ. Chúng tôi sẽ thông báo khi có ưu đãi!";
                    } else if (err.message.includes("SAVED_AS_PENDING")) {
                        throw err;
                    } else if (err.message.includes("INVALID_SECRET_CODE")) {
                        // ⭐ BẢO MẬT: Xử lý lỗi mã không hợp lệ từ server
                        errorMessage = "Mã ưu đãi không hợp lệ.";
                        const codeInput = document.getElementById('secret-code-input');
                        if (codeInput) codeInput.classList.add('error');
                    } else if (err.message.includes('Failed to fetch')) {
                        errorMessage = `Lỗi mạng hoặc kết nối. Vui lòng kiểm tra lại đường truyền và thử lại.`
                    } else {
                        errorMessage = ` ${err.message}. Vui lòng thử lại.`
                    }
                    showMessage(errorMessage, messageAreaId);
                    toggleButtonLoading(false, btnId);
                    return false;
                }
            }
            
            async function handleNormalSubmit() {
                const phone = document.getElementById('phone').value.trim();
                try {
                    const success = await submitData(phone);
                    if (success) {
                        showSuccessScreen(phone);
                        startConfetti();
                    }
                } catch (err) {
                    if (err.message.includes("SAVED_AS_PENDING")) {
                        showBaitScreen();
                    }
                }
            }

            function showMessage(message, areaId = 'message-area') {
                const messageArea = document.getElementById(areaId);
                if(!messageArea) return;
                messageArea.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span>${message}</span>
                `;
                messageArea.style.display = 'flex';
            }

            function toggleButtonLoading(isLoading, btnId = 'submitBtn') {
                const submitButton = document.getElementById(btnId);
                if(!submitButton) return;
                const btnText = submitButton.querySelector('span:not(.loading-spinner)');
                const loadingSpinner = submitButton.querySelector('.loading-spinner');
                
                submitButton.disabled = isLoading;
                if(btnText) btnText.style.display = isLoading ? 'none' : 'inline';
                if(loadingSpinner) loadingSpinner.style.display = isLoading ? 'inline-block' : 'none';
            }
            
            function showSuccessScreen(phone) {
                if(socialProofInterval) clearInterval(socialProofInterval);
                DOMElements.card.style.padding = "20px";
                DOMElements.card.style.marginTop = "60px";
                
                DOMElements.formContainer.innerHTML = `
                    <div class="result-screen">
                        <img src="https://i.postimg.cc/1tv3ZfH0/LOGO-1.png" alt="Logo Bánh Mì Ông Kòi" class="logo" style="margin-top: -75px;"/>
                        <h2>BẠN ĐÃ NHẬN ĐƯỢC ƯU ĐÃI!</h2>

                        <div id="qrcode-container" style="padding: 15px; background: white; border-radius: 10px; display: inline-block; margin-bottom: 20px; border: 2px solid var(--primary-color);">
                            <div id="qrcode"></div>
                        </div>

                       <div class="instructions" style="text-align: left; padding: 15px; background-color: #F3F4F6; border-radius: 10px;">
  <p><strong>1.</strong> Lưu mã QR này về máy để dễ dàng xuất trình sau này.</p>
  <p><strong>2.</strong> Chờ tin nhắn thông báo của sốp về SDT ZALO theo số đk để kích hoạt áp dụng mã ưu đãi.</p>
  <p><strong style="color: red;">‼️ Lưu ý:</strong> Zalo của bạn cần bật chế độ cho phép người lạ tìm kiếm bằng số điện thoại để nhận được tin nhắn từ Bánh Mì Ông Kòi.</p>
</div>

                        <p class="follow-us-prompt">Psst... Đừng bỏ lỡ ưu đãi nào khác! Theo dõi chúng tôi ngay:</p>
                        <a href="https://www.facebook.com/BanhMiOngKoi" target="_blank" class="fb-button">
                            <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.03998C6.48 2.03998 2 6.51998 2 12.04C2 17.08 5.64 21.22 10.44 21.96V14.88H7.88V12.04H10.44V9.83998C10.44 7.29998 11.96 5.95998 14.22 5.95998C15.32 5.95998 16.46 6.15998 16.46 6.15998V8.63998H15.18C13.88 8.63998 13.56 9.35998 13.56 10.16V12.04H16.34L15.88 14.88H13.56V22C18.36 21.24 22 17.08 22 12.04C22 6.51998 17.52 2.03998 12 2.03998Z"></path></svg>
                            <span>THEO DÕI FANPAGE</span>
                        </a>
                    </div>
                `;

                const qrcodeElement = document.getElementById('qrcode');
                if (qrcodeElement && typeof QRCode !== 'undefined') {
                    new QRCode(qrcodeElement, {
                        text: `${phone}-UUDAI7K`,
                        width: 200,
                        height: 200,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }
            }

            function showBaitScreen() {
                 if(socialProofInterval) clearInterval(socialProofInterval);
                 DOMElements.card.style.padding = "20px";
                 DOMElements.card.style.marginTop = "60px";
                 DOMElements.formContainer.innerHTML = `
                    <div class="result-screen">
                        <img src="https://i.postimg.cc/1tv3ZfH0/LOGO-1.png" alt="Logo Bánh Mì Ông Kòi" class="logo" style="margin-top: -75px;"/>
                        <div class="promo-image-wrapper" style="margin-top: 15px;">
                            <img src="https://i.postimg.cc/qvKqCBJ0/Thi-t-k-ch-a-c-t-n.png" alt="Combo Bánh Bao Xiên Nướng" class="promo-image"/>
                        </div>
                        <h2 style="font-size: 1.5rem; color: var(--dark-color); text-transform: uppercase; margin-top: 0;">RẤT TIẾC, ƯU ĐÃI TẠM HẾT!</h2>
                        <p class="instructions" style="background-color: #FFFBEB; margin-bottom: 20px; border: 1px solid #FEEBCB;">
                           Chúng tôi đã lưu lại SĐT của bạn. BÁNH MÌ ÔNG KÒI sẽ <strong>ưu tiên liên hệ</strong> với bạn ngay khi có chương trình ưu đãi mới.
                        </p>
                         <p class="follow-us-prompt">Psst... Đừng bỏ lỡ ưu đãi nào khác! Theo dõi chúng tôi ngay:</p>
                         <a href="https://www.facebook.com/BanhMiOngKoi" target="_blank" class="fb-button">
                            <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.03998C6.48 2.03998 2 6.51998 2 12.04C2 17.08 5.64 21.22 10.44 21.96V14.88H7.88V12.04H10.44V9.83998C10.44 7.29998 11.96 5.95998 14.22 5.95998C15.32 5.95998 16.46 6.15998 16.46 6.15998V8.63998H15.18C13.88 8.63998 13.56 9.35998 13.56 10.16V12.04H16.34L15.88 14.88H13.56V22C18.36 21.24 22 17.08 22 12.04C22 6.51998 17.52 2.03998 12 2.03998Z"></path></svg>
                            <span>THEO DÕI ĐỂ KHÔNG BỎ LỠ</span>
                        </a>
                    </div>
                `;
            }

            function startConfetti() {
                for (let i = 0; i < 50; i++) {
                    const confettiPiece = document.createElement('div');
                    confettiPiece.className = 'confetti-piece';
                    confettiPiece.style.left = Math.random() * 100 + 'vw';
                    confettiPiece.style.animationDelay = Math.random() * 4 + 's';
                    confettiPiece.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    DOMElements.confettiContainer.appendChild(confettiPiece);
                }
                setTimeout(() => {
                    DOMElements.confettiContainer.innerHTML = '';
                }, 6000);
            }

            function showCustomConfirm(msg) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('custom-confirm-overlay');
                    const msgEl = document.getElementById('custom-confirm-msg');
                    const yesBtn = document.getElementById('custom-confirm-yes');
                    const noBtn = document.getElementById('custom-confirm-no');

                    msgEl.textContent = msg;
                    overlay.classList.add('show');

                    const cleanup = (result) => {
                        overlay.classList.remove('show');
                        resolve(result);
                    };

                    yesBtn.onclick = () => cleanup(true);
                    noBtn.onclick = () => cleanup(false);
                });
            }
            
            function showSecretCodeModal() {
                const overlay = document.getElementById('secret-code-overlay');
                const codeInput = document.getElementById('secret-code-input');
                const phoneInput = document.getElementById('secret-code-phone');
                const submitBtn = document.getElementById('secret-code-submit');
                const cancelBtn = document.getElementById('secret-code-cancel');
                const messageArea = document.getElementById('secret-code-message-area');

                codeInput.value = '';
                phoneInput.value = '';
                messageArea.style.display = 'none';
                overlay.classList.add('show');

                // ⭐ BẢO MẬT: Cập nhật hàm để gửi mã lên server kiểm tra
                const handleSubmit = async () => {
                    const code = codeInput.value.trim().toUpperCase();
                    const phone = phoneInput.value.trim();
                    
                    // Không kiểm tra mã ở client nữa.
                    // if (!SECRET_CODES.includes(code)) { ... } // ĐÃ XÓA

                    try {
                        const success = await submitData(phone, code);
                         if(success) {
                            overlay.classList.remove('show');
                            showSuccessScreen(phone);
                            startConfetti();
                        }
                    } catch(err) {
                        // Lỗi SAVED_AS_PENDING vẫn được xử lý như cũ
                        if (err.message.includes("SAVED_AS_PENDING")) {
                            overlay.classList.remove('show');
                            showBaitScreen();
                        }
                        // Các lỗi khác (INVALID_SECRET_CODE, PHONE_DUPLICATE,...) đã được xử lý trong hàm submitData
                    }
                };

                const handleCancel = () => {
                    overlay.classList.remove('show');
                };

                submitBtn.onclick = handleSubmit;
                cancelBtn.onclick = handleCancel;
                codeInput.oninput = () => codeInput.classList.remove('error');
                phoneInput.oninput = () => phoneInput.classList.remove('error');
            }

            async function togglePromo() {
                const newStatus = state.isPromoPaused ? "RUNNING" : "PAUSED";
                const confirmMsg = state.isPromoPaused 
                    ? 'Bạn có chắc muốn BẬT LẠI chương trình ưu đãi không?'
                    : 'Bạn có chắc muốn TẠM DỪNG chương trình ưu đãi không?';
                
                const confirmed = await showCustomConfirm(confirmMsg);
                if (!confirmed) return;

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ 
                            action: 'setPromoStatus', 
                            status: newStatus,
                            password: state.adminPassword 
                        })
                    });
                    const result = await res.json();

                    if (result.status !== 'SUCCESS') {
                        throw new Error(result.message || 'Không thể cập nhật trạng thái.');
                    }

                    state.isPromoPaused = (newStatus === "PAUSED");
                    updateAdminPanel();
                    
                    if(newStatus === "PAUSED") {
                        if(socialProofInterval) clearInterval(socialProofInterval);
                    } else {
                        startSocialProof();
                    }

                } catch (err) {
                    showMessage('Lỗi: ' + err.message, 'message-area');
                }
            }

            let logoClickCount = 0;
            let logoClickTimer;

            function updateAdminPanel() {
                if (state.isPromoPaused) {
                    DOMElements.promoStatusLabel.textContent = 'Trạng thái: Đã tạm dừng';
                    DOMElements.togglePromoBtn.textContent = 'BẬT LẠI ƯU ĐÃI';
                    DOMElements.togglePromoBtn.className = 'off';
                } else {
                    DOMElements.promoStatusLabel.textContent = 'Trạng thái: Đang chạy';
                    DOMElements.togglePromoBtn.textContent = 'TẠM DỪNG ƯU ĐÃI';
                    DOMElements.togglePromoBtn.className = 'on';
                }
            }
            
            function showAdminLoginModal() {
                const overlay = document.getElementById('admin-login-overlay');
                const passwordInput = document.getElementById('admin-password-input');
                const submitBtn = document.getElementById('admin-login-submit');
                const cancelBtn = document.getElementById('admin-login-cancel');
                const messageArea = document.getElementById('admin-login-message-area');

                passwordInput.value = '';
                messageArea.style.display = 'none';
                overlay.classList.add('show');

                const handleSubmit = async () => {
                    const password = passwordInput.value.trim();
                    if (!password) {
                        showMessage('Vui lòng nhập mật khẩu.', 'admin-login-message-area');
                        return;
                    }

                    toggleButtonLoading(true, 'admin-login-submit');
                    
                    try {
                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'verifyAdminPassword', password: password })
                        });
                        const result = await res.json();

                        if (result.status === 'SUCCESS' && result.data.verified) {
                            state.adminPassword = password;
                            overlay.classList.remove('show');
                            await fetchInitialState();
                            updateAdminPanel();
                            DOMElements.adminPanel.classList.add('show');
                        } else {
                            throw new Error(result.message);
                        }
                    } catch (err) {
                        if (err.message.includes("INVALID_PASSWORD")) {
                            showMessage('Mật khẩu không chính xác.', 'admin-login-message-area');
                        } else {
                            showMessage('Lỗi: ' + err.message, 'admin-login-message-area');
                        }
                    } finally {
                        toggleButtonLoading(false, 'admin-login-submit');
                    }
                };
                
                const handleCancel = () => overlay.classList.remove('show');

                submitBtn.onclick = handleSubmit;
                cancelBtn.onclick = handleCancel;
                passwordInput.oninput = () => messageArea.style.display = 'none';
                passwordInput.onkeypress = (e) => {
                    if (e.key === 'Enter') handleSubmit();
                };
            }

            function handleLogoClick() {
                logoClickCount++;
                clearTimeout(logoClickTimer);
                logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1500); 

                if (logoClickCount === 5) {
                    logoClickCount = 0;
                    showAdminLoginModal();
                }
            }

            async function fetchInitialState() {
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'getPromoStatus' })
                    });
                    const result = await res.json();
                    
                    if (result.status === 'SUCCESS' && result.data && result.data.promoStatus) {
                        state.isPromoPaused = (result.data.promoStatus === 'PAUSED');
                    } else {
                        console.error("Không thể lấy trạng thái.", result.message);
                    }
                } catch (err) {
                    console.error("Lỗi khi lấy trạng thái.", err);
                }
            }
            
            function init() {
                renderInitialView();
                DOMElements.closeAdminBtn.addEventListener('click', () => DOMElements.adminPanel.classList.remove('show'));
                DOMElements.togglePromoBtn.addEventListener('click', togglePromo);
            }

            init();

        })();
    </script>

</body>
</html>
