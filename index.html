<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ưu Đãi Đặc Biệt - Bánh Mì Ông Kòi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap');
        :root {
            --primary-color: #fc6806;
            --dark-color: #A15200;
            --background-color: #FFF7ED;
            --text-color: #4B5563;
            --white-color: #FFFFFF;
            --error-color: #DC2626;
            --hot-deal-color: #ff4d4d;
            --radius: 20px;
            --shadow: 0 10px 30px -5px rgba(252, 104, 6, 0.15);
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .main-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .card {
            background-color: var(--white-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px 35px 35px 35px;
            position: relative;
            margin-top: 60px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: -75px auto 15px;
            display: block;
            position: relative;
            z-index: 2;
            border: 5px solid var(--white-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            object-fit: cover;
            animation: slideUp 0.7s 0.2s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        
        .promo-image-wrapper {
            position: relative;
            margin-bottom: 25px;
            overflow: hidden; 
            border-radius: var(--radius);
            animation: imageImpactDrop 1s cubic-bezier(0.25, 1, 0.5, 1) 0.4s both;
        }
        
        @keyframes imageImpactDrop {
            0% { transform: translateY(-100%) scale(0.8); opacity: 0; }
            60% { transform: translateY(10px) scale(1.05); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.95); }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .promo-image-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 70%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: shine-effect 1.5s ease-in-out 1.2s; 
        }

        @keyframes shine-effect {
            to { left: 150%; }
        }

        .promo-image {
            width: 100%;
            display: block;
        }

        .promo-badge {
            position: absolute;
            top: 20px;
            right: -8px;
            background: linear-gradient(45deg, var(--hot-deal-color), #ff8c00);
            color: white;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-transform: uppercase;
            transform-origin: bottom left; 
            animation: badgeSlapOn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s both, 
                       wobble 2.5s infinite 2s;
        }

        @keyframes badgeSlapOn {
            0% { transform: scale(0) rotate(-90deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(25deg); opacity: 1; }
            100% { transform: scale(1) rotate(15deg); opacity: 1; }
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(15deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(20deg); }
        }

        .offer-title {
            margin-bottom: 25px;
        }
        
        .main-title {
            color: var(--dark-color);
            font-weight: 700;
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            animation: slideUp 0.7s 1.2s cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        .price-block {
            background-color: #fff;
            border: 2px dashed var(--primary-color);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 25px;
            animation: slideUp 0.7s 1.3s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        .price-line {
            overflow: hidden;
        }
        .price-line span {
            display: inline-block;
            transform: translateY(110%);
            animation: textReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .original-price {
            font-size: 1.2rem;
            color: var(--text-color);
            font-weight: 600;
        }
        .original-price span { animation-delay: 1.4s; }

        .deal-label {
            font-size: 1rem;
            color: var(--dark-color);
            font-weight: 700;
            text-transform: uppercase;
            margin: 8px 0;
        }
        .deal-label span { animation-delay: 1.5s; }

        .final-price {
            font-size: 3rem;
            color: var(--hot-deal-color);
            font-weight: 700;
            line-height: 1;
        }
        .final-price span { animation-delay: 1.6s; }

        @keyframes textReveal {
            to { transform: translateY(0); }
        }
        
        .countdown-timer {
            background-color: #fffbeb;
            border: 2px dashed var(--primary-color);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 25px;
            animation: slideUp 0.7s 1.7s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        .countdown-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-color);
            margin: 0 0 15px;
            text-transform: uppercase;
        }
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .timer-box {
            background: var(--white-color);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .timer-box span {
            display: block;
            color: var(--primary-color);
            font-weight: 700;
        }
        .timer-box span:first-child {
            font-size: 2rem;
            line-height: 1;
        }
        .timer-box .timer-label {
            font-size: 0.8rem;
            color: var(--text-color);
            font-weight: 600;
            margin-top: 5px;
        }

        .input-group {
             animation: slideUp 0.7s 1.8s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        input[type="tel"] {
            width: 100%; padding: 18px; border: 2px solid #E5E7EB;
            border-radius: var(--radius); font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif; font-weight: 700;
            box-sizing: border-box; transition: border-color 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        input[type="tel"]:focus {
            outline: none; border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(252, 104, 6, 0.1);
        }
        input[type="tel"].error {
            border-color: var(--error-color);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .scarcity-notice {
            margin-top: 25px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
            animation: slideUp 0.7s 1.9s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        .scarcity-notice strong {
            color: var(--hot-deal-color);
            font-size: 1.1em;
        }

        button#submitBtn {
            width: 100%; padding: 18px; background: var(--primary-color);
            color: var(--white-color); border: none; border-radius: var(--radius);
            font-size: 1.3rem; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s; 
            display: flex;
            justify-content: center; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 15px;
            box-shadow: 0 4px 20px -5px rgba(252, 104, 6, 0.5);
            animation: slideUp 0.7s 2.0s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px -5px rgba(252, 104, 6, 0.6);
        }
        button:active {
            transform: translateY(-1px) scale(0.98);
        }
        button:disabled {
            opacity: 0.7; cursor: not-allowed;
            transform: translateY(0);
            animation: none;
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #ffffff;
            border-radius: 50%; width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .social-proof {
            margin-top: 20px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.95rem;
            animation: slideUp 0.7s 2.1s cubic-bezier(0.25, 1, 0.5, 1) both;
        }
        .social-proof strong {
            color: var(--dark-color);
        }
        .social-proof-animation {
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #message-area {
            margin-top: 15px; padding: 15px; border-radius: 12px;
            display: none; animation: slideIn 0.4s ease-out;
            font-weight: 600; line-height: 1.6;
            background-color: #FEE2E2; color: var(--error-color);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .result-screen {
            text-align: center; border: 2px dashed var(--primary-color);
            padding: 20px; border-radius: var(--radius); background-color: #fff;
        }
        .result-screen .logo { max-width: 80px; margin-bottom: 15px; }
        .result-screen h2 {
            font-size: 1.5rem; color: var(--dark-color);
            margin: 0 0 10px; text-transform: uppercase;
        }
        .result-screen .promo-details {
            background-color: #FFFBEB; padding: 15px;
            border-radius: 10px; margin-bottom: 20px;
        }
        .result-screen .promo-details p {
            margin: 0; font-size: 1.1rem;
            color: var(--dark-color); font-weight: 600;
        }
        .result-screen .promo-details .price {
            font-size: 2.5rem; font-weight: 700;
            color: var(--primary-color); margin-top: 5px;
        }
        .result-screen .instructions {
            font-size: 1rem; color: var(--text-color);
            background-color: #F3F4F6; padding: 15px;
            border-radius: 10px; font-weight: 600;
        }
        /* Nút Facebook */
        .fb-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #1877F2; /* Facebook Blue */
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px -5px rgba(24, 119, 242, 0.5);
        }
        .fb-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px -5px rgba(24, 119, 242, 0.6);
        }
        .fb-button svg {
            width: 24px;
            height: 24px;
        }

        .confetti {
            position: fixed; top: 0; left: 0; width: 100%;
            height: 100%; pointer-events: none; z-index: 1;
        }
        .confetti-piece {
            position: absolute; width: 10px; height: 20px;
            background: var(--primary-color); top: -50px;
            opacity: 0; animation: drop 4s linear infinite;
        }
        .confetti-piece:nth-child(2n) { background: #FFD700; }
        .confetti-piece:nth-child(3n) { background: #FF4D4D; }
        .confetti-piece:nth-child(4n) { background: #34D399; }
        @keyframes drop {
            0% { transform: translateY(0) rotateZ(0); opacity: 1; }
            100% { transform: translateY(100vh) rotateZ(720deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { 
                padding: 20px;
                margin-top: 50px; 
            }
            
            .logo { 
                width: 80px; 
                height: 80px; 
                margin: -55px auto 10px;
            }

            .promo-image-wrapper, .offer-title, .countdown-timer {
                margin-bottom: 20px;
            }

            .main-title { 
                font-size: 1.2rem;
                margin-bottom: 15px;
            }
            .price-block {
                padding: 12px;
            }
            .original-price { font-size: 1.1rem; }
            .deal-label { font-size: 0.9rem; margin: 6px 0; }
            .final-price { font-size: 2.8rem; }

            .countdown-timer {
                padding: 12px;
                border-radius: 15px;
            }
            .countdown-title {
                font-size: 1rem;
                margin-bottom: 12px;
            }
            .timer-box span:first-child { 
                font-size: 1.8rem; 
            }
            .timer-box .timer-label {
                font-size: 0.7rem;
                margin-top: 3px;
            }

            input[type="tel"] {
                padding: 16px;
                font-size: 1.1rem;
            }
            .scarcity-notice, .social-proof {
                margin-top: 15px;
                font-size: 0.9rem;
            }
            
            button#submitBtn { 
                font-size: 1.15rem; 
                padding: 16px;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="confetti" id="confetti-container"></div>
    <div class="main-container" id="main-container">
        <div class="card">
            <div id="form-container">
                <img src="https://i.postimg.cc/1tv3ZfH0/LOGO-1.png" alt="Logo Bánh Mì Ông Kòi" class="logo"/>
                
                <div class="promo-image-wrapper">
                    <img src="https://i.postimg.cc/qvKqCBJ0/Thi-t-k-ch-a-c-t-n.png" alt="Combo Bánh Bao Xiên Nướng" class="promo-image"/>
                    <div class="promo-badge"><span>🔥</span> Hot Deal</div>
                </div>

                <div class="offer-title">
                    <h1 class="main-title">COMBO: BÁNH BAO XIÊN NƯỚNG</h1>
                    <div class="price-block">
                        <div class="price-line original-price"><span>Giá gốc: <del>22.000Đ</del></span></div>
                        <div class="price-line deal-label"><span>🔥 Ưu đãi hôm nay 🔥</span></div>
                        <div class="price-line final-price"><span>CHỈ 7.000Đ</span></div>
                    </div>
                </div>

                <div id="countdown-timer" class="countdown-timer">
                    <p class="countdown-title">Ưu đãi kết thúc sau</p>
                    <div class="timer-grid">
                        <div class="timer-box"><span id="hours">00</span><span class="timer-label">Giờ</span></div>
                        <div class="timer-box"><span id="minutes">00</span><span class="timer-label">Phút</span></div>
                        <div class="timer-box"><span id="seconds">00</span><span class="timer-label">Giây</span></div>
                    </div>
                </div>

                <div class="input-group">
                    <input type="tel" id="phone" placeholder="Nhập số điện thoại Zalo của bạn" maxlength="10">
                </div>
                
                <p class="scarcity-notice" id="scarcity-notice">
                    Chỉ còn lại <strong>100</strong> suất trong hôm nay!
                </p>

                <button id="submitBtn">
                    <span id="btnText">NHẬN ƯU ĐÃI NGAY!</span>
                    <span id="loadingSpinner" style="display: none;" class="loading-spinner"></span>
                </button>

                <div class="social-proof" id="social-proof">
                    <span class="social-proof-animation">⚡️ <strong>38 người</strong> đã nhận ưu đãi!</span>
                </div>

                <div id="message-area"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const DOMElements = {
                phoneInput: document.getElementById('phone'),
                submitButton: document.getElementById('submitBtn'),
                btnText: document.getElementById('btnText'),
                loadingSpinner: document.getElementById('loadingSpinner'),
                messageArea: document.getElementById('message-area'),
                formContainer: document.getElementById('form-container'),
                confettiContainer: document.getElementById('confetti-container'),
                card: document.querySelector('.card'),
                hours: document.getElementById('hours'),
                minutes: document.getElementById('minutes'),
                seconds: document.getElementById('seconds'),
                scarcityNotice: document.getElementById('scarcity-notice'),
                scarcityCounter: document.getElementById('scarcity-notice').querySelector('strong'),
                socialProof: document.getElementById('social-proof').querySelector('strong')
            };

            const API_URL = "https://script.google.com/macros/s/AKfycbz0TCr3kDTAayb-jbSOaZcHry8h6zXtU4GZdc_tYx0m0vbN9SOufv4nxle1WJaGGqgKXg/exec";

            let stock = 100;
            let claims = 38;
            let liveCounterInterval;
            let hasStockRunOut = false;

            function startCountdown() {
                const now = new Date();
                const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
                
                const interval = setInterval(() => {
                    const currentTime = new Date().getTime();
                    const distance = endOfDay - currentTime;

                    if (distance < 0) {
                        clearInterval(interval);
                        document.getElementById('countdown-timer').innerHTML = '<p class="countdown-title">ƯU ĐÃI HÔM NAY ĐÃ KẾT THÚC!</p>';
                        DOMElements.submitButton.disabled = true;
                        DOMElements.btnText.textContent = "HẸN BẠN NGÀY MAI";
                        return;
                    }

                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    DOMElements.hours.textContent = String(hours).padStart(2, '0');
                    DOMElements.minutes.textContent = String(minutes).padStart(2, '0');
                    DOMElements.seconds.textContent = String(seconds).padStart(2, '0');
                }, 1000);
            }

            function updateLiveCounters() {
                DOMElements.scarcityCounter.textContent = stock;
                DOMElements.socialProof.textContent = `${claims} người`;

                liveCounterInterval = setInterval(() => {
                    if (stock <= 50) {
                        if (!hasStockRunOut) {
                            DOMElements.scarcityNotice.innerHTML = '🔥 <strong>ĐÃ HẾT 50 SUẤT ƯU ĐÃI!</strong> 🔥';
                            DOMElements.btnText.textContent = 'ĐĂNG KÝ NHẬN ƯU ĐÃI SAU';
                            DOMElements.submitButton.style.backgroundColor = '#6D28D9';
                            hasStockRunOut = true;
                        }
                        clearInterval(liveCounterInterval);
                        return;
                    }
                    
                    stock--;
                    claims++;

                    DOMElements.scarcityCounter.textContent = stock;
                    DOMElements.socialProof.textContent = `${claims} người`;

                }, Math.random() * 20000 + 10000);
            }

            DOMElements.submitButton.addEventListener('click', submitData);
            DOMElements.phoneInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitData();
            });
            DOMElements.phoneInput.addEventListener('input', () => {
                DOMElements.phoneInput.classList.remove('error');
                DOMElements.messageArea.style.display = 'none';
            });

            async function submitData() {
                const phone = DOMElements.phoneInput.value.trim();
                
                DOMElements.phoneInput.classList.remove('error');
                DOMElements.messageArea.style.display = 'none';

                if (!/^0[0-9]{9}$/.test(phone)) {
                    showMessage("Số điện thoại không hợp lệ. Vui lòng nhập đúng 10 số, bắt đầu bằng 0.");
                    DOMElements.phoneInput.classList.add('error');
                    return;
                }
                
                toggleButtonLoading(true);

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'savePromoPhone', phone: phone })
                    });

                    if (!res.ok) throw new Error('Lỗi kết nối đến máy chủ.');
                    
                    const result = await res.json();
                    if (result.status !== 'SUCCESS') throw new Error(result.message || 'Lỗi không xác định.');

                    if (!hasStockRunOut) {
                        stock--;
                        claims++;
                        DOMElements.scarcityCounter.textContent = stock;
                        DOMElements.socialProof.textContent = `${claims} người`;
                        showSuccessScreen();
                        startConfetti();
                    } else {
                        showBaitScreen();
                    }

                } catch (err) {
                    let errorMessage = `Đã có lỗi xảy ra. Vui lòng thử lại.`;
                    if (err.message.includes('Failed to fetch')) {
                        errorMessage = `Lỗi mạng hoặc kết nối. Vui lòng kiểm tra lại đường truyền và thử lại.`
                    } else {
                        errorMessage = `Đã có lỗi xảy ra: ${err.message}. Vui lòng thử lại.`
                    }
                    showMessage(errorMessage);
                    toggleButtonLoading(false);
                }
            }
            
            function showMessage(message) {
                DOMElements.messageArea.textContent = message;
                DOMElements.messageArea.style.display = 'block';
            }

            function toggleButtonLoading(isLoading) {
                DOMElements.submitButton.disabled = isLoading;
                DOMElements.btnText.style.display = isLoading ? 'none' : 'inline';
                DOMElements.loadingSpinner.style.display = isLoading ? 'inline-block' : 'none';
            }
            
            function showSuccessScreen() {
                const logoSrc = document.querySelector('.logo').src;
                clearInterval(liveCounterInterval);
                DOMElements.card.style.padding = "20px";
                DOMElements.card.style.marginTop = "0";
                DOMElements.card.innerHTML = `
                    <div class="result-screen">
                        <img src="${logoSrc}" alt="Logo Bánh Mì Ông Kòi" class="logo"/>
                        <h2>BẠN ĐÃ NHẬN ĐƯỢC ƯU ĐÃI!</h2>
                        <div class="promo-details">
                            <p>COMBO BÁNH BAO XIÊN NƯỚNG</p>
                            <div class="price">7.000 Đ</div>
                        </div>
                        <p class="instructions">
                            ƯU ĐÃI sẽ được gửi đến Zalo của bạn trong THỜI GIAN SỚM NHẤT. Vui lòng kiểm tra tin nhắn từ BÁNH MÌ ÔNG KÒI và đến cửa hàng để nhận ưu đãi nhoa !
                        </p>
                    </div>
                `;
            }

            function showBaitScreen() {
                const logoSrc = document.querySelector('.logo').src;
                clearInterval(liveCounterInterval);
                DOMElements.card.style.padding = "20px";
                DOMElements.card.style.marginTop = "0";
                DOMElements.card.innerHTML = `
                    <div class="result-screen">
                        <img src="${logoSrc}" alt="Logo Bánh Mì Ông Kòi" class="logo"/>
                        <h2>RẤT TIẾC, BẠN ĐÃ CHẬM MẤT RỒI!</h2>
                        <p class="instructions" style="background-color: #E5E7EB;">
                           50 suất ưu đãi hôm nay đã được nhận hết. Đừng lo, SĐT của bạn đã được lưu lại để ưu tiên cho lần sau.
                        </p>
                        <p class="instructions" style="margin-top: 15px;">
                           Để không bỏ lỡ bất kỳ ưu đãi nào, hãy <strong>theo dõi Fanpage</strong> của chúng tôi. Mọi thông báo sẽ được đăng tải đầu tiên trên đó!
                        </p>
                        <a href="https://www.facebook.com/BanhMiOngKoi" target="_blank" class="fb-button">
                            <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.03998C6.48 2.03998 2 6.51998 2 12.04C2 17.08 5.64 21.22 10.44 21.96V14.88H7.88V12.04H10.44V9.83998C10.44 7.29998 11.96 5.95998 14.22 5.95998C15.32 5.95998 16.46 6.15998 16.46 6.15998V8.63998H15.18C13.88 8.63998 13.56 9.35998 13.56 10.16V12.04H16.34L15.88 14.88H13.56V22C18.36 21.24 22 17.08 22 12.04C22 6.51998 17.52 2.03998 12 2.03998Z"></path></svg>
                            <span>THEO DÕI FANPAGE</span>
                        </a>
                    </div>
                `;
            }

            function startConfetti() {
                for (let i = 0; i < 50; i++) {
                    const confettiPiece = document.createElement('div');
                    confettiPiece.className = 'confetti-piece';
                    confettiPiece.style.left = Math.random() * 100 + 'vw';
                    confettiPiece.style.animationDelay = Math.random() * 4 + 's';
                    confettiPiece.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    DOMElements.confettiContainer.appendChild(confettiPiece);
                }
                setTimeout(() => {
                    DOMElements.confettiContainer.innerHTML = '';
                }, 6000);
            }

            startCountdown();
            updateLiveCounters();

        })();
    </script>
